storeDir: .pnpm-store
# T0.2 (V2 release batch, folded into T6.3): align the auto-installed
# transitive dsh-* peer train with the direct pins (package.json
# peerDependencies / dependencies / devDependencies). pnpm keeps the stale
# old-train peer selections in the lockfile when a parent package is re-pinned
# (`pnpm update <pkg>@<ver>` does not re-resolve auto-installed peers),
# leaving unmet peers and install-time peer WARNs this override exists to
# eliminate. All ten ranges ACCEPT the pinned train — the override only
# forces the resolver to the same release train, it does not override any
# incompatible constraint.
# 2026-09-01 re-anchor: harness release dsh-0.1.2-alpha.3 (registry train
# complete for all ten packages; 0.1.2-alpha.4 also published) — pins +
# overrides moved 0.1.1-rc.2 -> 0.1.2-alpha.3 (Windows §H bug: mixed
# dsh-tools/dsh-session train in the profile; the new train moved
# isJsonValue/snapshotJsonValue to @deepseek-ai/dsh-util-values, a hard
# dep of both, so a consistent install can no longer skew this way).
# 0.2.0-rc.2 re-anchor (this branch): the train is the pristine reference
# checkout stable-3-0.2.0-rc.2 @ 639ed015397290b3745d163aafe02ffee4aa3f84.
# `@deepseek-ai/dsh-code-runtime` DROPPED: that package is not published at
# 0.2.0-rc.2 (registry max 0.1.5-rc.3), the 0.2 monorepo contains no such
# package, and nothing in the 0.2 dependency closure requires it — overriding
# it to a version that does not exist would be an unresolvable pin, so the
# entry is removed rather than re-pinned. The remaining nine ranges all ACCEPT
# the 0.2.0-rc.2 train (verified against the published manifests).
overrides:
  '@deepseek-ai/dsh-attachment': 0.2.0-rc.2
  '@deepseek-ai/dsh-agent': 0.2.0-rc.2
  '@deepseek-ai/dsh-brand': 0.2.0-rc.2
  '@deepseek-ai/dsh-invariants': 0.2.0-rc.2
  '@deepseek-ai/dsh-scope': 0.2.0-rc.2
  '@deepseek-ai/dsh-session': 0.2.0-rc.2
  '@deepseek-ai/dsh-system-prompt': 0.2.0-rc.2
  '@deepseek-ai/dsh-timeout': 0.2.0-rc.2
  '@deepseek-ai/dsh-user-approval': 0.2.0-rc.2
