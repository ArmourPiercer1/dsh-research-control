# G1 契约会合 —— 逐条对账清单（可 diff、可机验）
#
# 为什么存在：外部复审第三轮（2026-10-30，裁定 CONDITIONAL PASS·需修订）指出本计划的
# G1 放行判据"冲突清单每条都有权威指向"仍是**人工核对**，按本文自己的标准
# （不得写"经审查通过"这类无法机验的话）不达标。本文件把它变成机验对象。
#
# 放行判据（写进 IMPLEMENTATION-PLAN-DRAFT.md §2 G1）：
# 【现行机验，外部复审第五轮补，2026-10-31；第六轮修订谓词 + 第七轮 superseded 反洗白补门，2026-10-31】
#   node experiments/v3-code-architecture-poc/g1-checklist-validate.mjs            ⇒ exit 0（结构/语义校验绿；assigned 允许日常存在；superseded 缺人工确认在日常形态**不拦**，见下）
#   node experiments/v3-code-architecture-poc/g1-checklist-validate.mjs --self-test ⇒ exit 0（校验器变异自验，架空非删除；**26 条形变**（第八轮实测；条数一律以运行输出为准）：M1–M7 原有 + M8–M12 第六轮反例 + M14–M17 第七轮 superseded 反洗白【终局洗白最小形 / 带 review 仍形不足 / 旧字段 supersedes 复活 / 旧名切断继任链必双红】+ M18–M21 锚点真值（P1-2：假提交号红 / 幽灵路径红 / 真锚绿防空转 / §E4 洗白全形常驻回归）+ M22–M26 第八轮两处小口收紧【签字日期真值：9999-99-99 红、2026-02-30 红、2024-02-29 闰日必须绿；参数面 fail-loud：裸位置参数必非 0、`--file <路径>` 必须正常】+ P1 正向形状【全清必须判绿，防死闸】；甩锅链完整形态在自验输出里逐字留形）
#   参数面 fail-loud（第八轮，验席挖出的小口）：未知参数 / 裸位置参数 / flag 缺值 / flag 重复
#     ⇒ **exit 2** 并打印一行用法说明。旧实现用 includes/indexOf 读参数、其余静默忽略，于是
#     `… g1-checklist-validate.mjs 某清单.yaml` 丢掉路径后去校验**默认主清单**并 exit 0——
#     调用者以为验绿的是自己指定的那份。校验对象与调用者所指不一致时，绿就是假的。
#   node experiments/v3-code-architecture-poc/g1-checklist-validate.mjs --require-clear ⇒ exit 0
#     （**终局放行谓词**，第六轮改写、第七轮补门、第八轮收紧签字日期：违规==0 且所有有效工作项均为 done、或为
#      superseded_by 链最终到达 done、且**带合法 supersession_review（REVIEW: <日期> <审查者>，
#      日期须为**真实历法日期**——`9999-99-99`、`2026-02-30` 形合而历法不存在，不算签字；
#      闰日 `2024-02-29` 是真日子必须放行，审查者≠owner）的 superseded**——`open`/`assigned` 一律不放行，未经人工确认的 superseded
#      一律不放行。「已指派」是推进态不是终局态（旧洞由 M8 钉死）；「全改 superseded 指向任意
#      done」的终局洗白由 SUPERSESSION-REASON/EVIDENCE + review 门 + M14/M15 钉死）
# 【已被取代（旧 grep 判据，第三轮原文保留以示演化；锚定教训仍然有效：任何 grep 都会
#   被文件头注释里的示例字样自我命中，这正是整体换成「解析式校验器」的理由之一）】
#   grep -c '^    status: open$'  experiments/v3-code-architecture-poc/G1-RECONCILIATION-CHECKLIST.yaml  ⇒ 0
#   grep -c '^    owner: "UNASSIGNED"$'  同一文件  ⇒ 0   # 每条都必须有权威归属，不许留空
# # 关闭任一条必须凑齐**三件套**（第六轮起全部机验）：owner 非 UNASSIGNED（OWNER-RULE，
# 权威性仍人工判据）+ evidence **可定位**依据（Q 编号 / 裁定提交号 / 用户指令原文位置，或带
# 扩展名的文件路径〔可带 :行号〕；DONE-EVIDENCE）+ resolution 写清「谁让位、依据什么」，
# 内容必须是可核对的裁定/实测出处而非结论词（DONE-RESOLUTION）。
# **不许为了过计数把条目删除**——删除会让 diff 显示条目减少，评审时按"逃逸"处理；
# id **不复用、不重排语义**（此两条为评审纪律，git diff 即机验面）。
#
# 字段语义：
#   id          稳定标识，不随文档重排改变；形如 G1-<域>-<NN>，唯一
#   topic       冲突/接口项一句话（≠ 机验契约文本里的 spec 字段名——两者同义，校验器收 topic/spec 恰其一）
#   sources     三份契约（PR #42 语义 / PR #44 机制 / PR #47 Schema）及仓内文档的具体位置
#   owner       权威归属：最终由哪份契约 + 哪个 Q 编号/裁定说了算；未指派 ⇒ UNASSIGNED（放行前必须为 0；
#               open 允许 UNASSIGNED，其余状态一律不许）
#   status      open | assigned | done | superseded
#               （2026-10-31 词汇迁移：v1 的 `resolved` ≡ `done`；既有 4 条 resolved 已逐条改写为 done，
#                 语义与 resolution 字段一字不变。旧词再出现即校验红——防的是词汇漂移，不是历史。
#                 第六轮：assigned 为有主推进态，日常合法，但**不过** --require-clear 终局门禁。）
#   evidence    判定所依据的实测/文档位置（含行号或提交号）；status=done 时必须非空且含可定位锚点
#               （「已修」不许是自我声明——GT 系列教训的迁移）
#   resolution（done 时**必填**，DONE-RESOLUTION 机验）谁让位、依据什么，内容须为可核对的
#               裁定/实测出处（Q 编号 / 提交 / 文件行位），不许只写结论词；open 时省略
#   superseded_by（第七轮改名自 supersedes）本条**被**哪条继任条目取代（方向：被取代者→取代者），
#               必须存在；status=superseded 时必填，且**继任链必须最终到达 done**
#               （SUPERSEDED-CHAIN：成环或终点 open/assigned 一律红）。
#               ⚠ 方向警示：`docs/decisions/ADR-0003` 的 `supersedes` 是**取代者→被取代者**，
#               与本字段方向相反——两个名字不许混用。旧字段名 `supersedes` 在本清单是
#               **禁止字段**，出现即 UNKNOWN-FIELD 红（自验 M16）；改名理由见校验器头注。
#   supersession_reason / supersession_evidence（status=superseded 时**必填**，第七轮）
#               替代理由 + 可定位替代证据；两者都必须含可定位锚点（提交号 / 带扩展名文件路径，
#               判据与 evidence/DONE-EVIDENCE 同）。空占位或「经审查确认」式结论词 = 红
#               （SUPERSESSION-REASON / SUPERSESSION-EVIDENCE）——「它被取代了」不许是自我声明。
#   supersession_review（终局面人工确认，第七轮；日常形态不要求）形如
#               "REVIEW: <YYYY-MM-DD> <非作者审查者>"。--require-clear 下缺失、形态不符、
#               **日期不是真实历法日期**（第八轮收紧：月须 01–12、日须在该月实际天数内；
#               `9999-99-99`、`2026-02-30` 形合而历法不存在 ⇒ 不算签字；闰日 `2024-02-29` 放行，
#               由自验 M22/M23 钉红、M24 防误伤）、
#               或审查者与 owner 同名 ⇒ 终局判红。设计依据（第七轮裁定原话）：
#               「机器无法自动证明两个复杂契约语义等价 ⇒ 用『结构校验 + 人工确认替代关系』的
#               门禁，不要继续堆自动推理规则」。
#   解析纪律（第六轮）：同一条目内同一字段出现两次 ⇒ **PARSE 直接红**（旧实现校验取末次、
#   统计取首次，「被验证的状态 ≠ 被统计的状态」——自验 M11 钉死）。

