# EB3 — CI = the same local gate commands (single kernel; AD-EB-02).
# Honest labels: check:types passes by REPRODUCING known TS debt exactly
# (see dev/engineering/tsc-debt.ids) — the job name/step names never claim a
# clean typecheck. Required status is only configured after the first real
# GitHub Actions red/green observations (G3 plan rule).
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: gate (tsc-debt / lint / build / freshness / docs / test / pack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # test-world fix for the G0-registered defect: store fixtures commit in
      # the sandboxed repo; give them an explicit identity instead of relying
      # on ambient config (fixture self-hardening tracked separately).
      GIT_AUTHOR_NAME: dsh-ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: dsh-ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: install (frozen lockfile, registry-public @deepseek-ai train)
        run: pnpm install --frozen-lockfile
      - name: tsc identity gate (known-failing debt must reproduce EXACTLY)
        run: pnpm run check:types
      - name: lint (INV-PERM-5)
        run: pnpm run lint
      - name: smoke-root guard matrix (P0#2)
        # rm -rf 面的机械守卫：红/绿矩阵必须逐例真实触发拒绝/放行。
        run: pnpm run check:smoke-guard
      - name: build (contract verify included)
        run: pnpm run build
      - name: prebuilt-artifact freshness
        run: pnpm run check:freshness
      - name: docs static consistency
        run: pnpm run docs:check
      - name: docs derived index current
        run: pnpm run docs:sync
      - name: BASELINE_READY certificate currency (P1#4)
        # 历史证书不冒充最新状态：registry 事实/债务台账变化后必须同 PR
        # `baseline:ready --emit` 重生成（比较时忽略含 SHA/机器检测的
        # Generated 头，跨 CI 镜像可比）。
        run: node scripts/baseline-ready.mjs --check docs/engineering-baseline/gates/G3-baseline-ready.md
      - name: full test suite
        run: pnpm test
      - name: pack:verify (unpack smoke incl.)
        run: pnpm run pack:verify
      - name: PoC sidecar health (advisory, non-voting)
        # #10 §2.1 失败隔离：PoC 红**绝不**成为主门禁的依赖——此步
        # continue-on-error，只为每次 PR 顺带看见侧车健康度。
        continue-on-error: true
        run: pnpm run test:poc
      - name: change-impact probe (voting for BLOCKING lanes)
        # 审查意见 P0#1（2026-10-27）：blocking 不再是标签——冻结契约/宿主适配/
        # 权限持久化面的变更必须带人工审查标记才放行（快照哈希不代替审查）。
        # advisory 发现仍只报告不拦（AD-EB-02 渐进升级策略不变）。
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -o pipefail  # 否则 tee 吞掉 probe 的 exit 1，投票变哑票
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          printf '%s' "$PR_BODY" > .pr-body.txt
          pnpm run docs:probe --base "$BASE" --json --fail-on-blocking --review-marker-file .pr-body.txt | tee probe.json
          { echo "## docs:probe"; echo '```'; jq -r '.findings[] | "\(.severity) \(.codes|join(",")) — \(.paths|length // 1) file(s)"' probe.json 2>/dev/null || cat probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
