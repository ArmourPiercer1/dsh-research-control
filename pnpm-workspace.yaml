storeDir: .pnpm-store
# T0.2 (V2 release batch, folded into T6.3): align the auto-installed
# transitive dsh-* peer train with the 0.1.1-rc.2 direct pins (package.json
# peerDependencies / dependencies / devDependencies). pnpm keeps the stale
# rc.8 peer selections in the lockfile when a parent package is re-pinned
# (`pnpm update <pkg>@0.1.1-rc.2` does not re-resolve auto-installed peers),
# leaving 10 unmet peers (^0.1.1-rc.2 vs installed 0.1.0-rc.8) and the
# install-time peer WARN this override exists to eliminate. All ten ranges
# ACCEPT 0.1.1-rc.2 — the override only forces the resolver to the same
# release train, it does not override any incompatible constraint.
overrides:
  '@deepseek-ai/dsh-attachment': 0.1.1-rc.2
  '@deepseek-ai/dsh-agent': 0.1.1-rc.2
  '@deepseek-ai/dsh-brand': 0.1.1-rc.2
  '@deepseek-ai/dsh-code-runtime': 0.1.1-rc.2
  '@deepseek-ai/dsh-invariants': 0.1.1-rc.2
  '@deepseek-ai/dsh-scope': 0.1.1-rc.2
  '@deepseek-ai/dsh-session': 0.1.1-rc.2
  '@deepseek-ai/dsh-system-prompt': 0.1.1-rc.2
  '@deepseek-ai/dsh-timeout': 0.1.1-rc.2
  '@deepseek-ai/dsh-user-approval': 0.1.1-rc.2
