# dev/engineering/registry.yaml — 非推导状态与证据的人工注册表
#
# 规则（AD-EB-02）：
#   - 本文件只登记**不可从代码/Git 推导**的事实：Gate 裁决、宿主 pin、债务例外、
#     证据指针。派生信息（文件清单、哈希）永远不放这里（那是 SNAPSHOT.md /
#     G0-inventory.yaml / docs/README.md 生成块的地盘）。
#   - 状态词汇各自独立、不得互相推导：
#       gate verdict: PASS | BLOCKED | PENDING | UNKNOWN
#       adr status:   proposed | accepted | implemented | verified | released
#     `docs:check` 拒绝把静态一致性冒充「已验证」：verdict=PASS 的 Gate 必须带
#     存在的 evidence 路径；引用不存在的证据文件 = 检查失败（虚假 verified）。
#   - 本文件是**人工**文件：`docs:sync --write` 被禁止写它（白名单之外）。
#   - 仅支持受限 YAML 子集（两层缩进 map、标量、flow/block list）；解析器见
#     scripts/docs/kernel.mjs。
schema_version: 1

